version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: nvr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nvr_db
      POSTGRES_USER: nvr_user
      POSTGRES_PASSWORD: nvr_pass
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  auth-service:
    build: ../auth-service/auth-service   # ← путь к твоему AuthService
    container_name: auth-service
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_TTL_MINUTES: ${APP_JWT_TTL_MINUTES:-60}
      APP_OTP_TTL_MINUTES: ${APP_OTP_TTL_MINUTES:-5}
      SERVER_PORT: ${SERVER_PORT:-8081}

      # Telegram (для dev)
      APP_TELEGRAM_ENABLED: ${APP_TELEGRAM_ENABLED}
      APP_TELEGRAM_BOT_TOKEN: ${APP_TELEGRAM_BOT_TOKEN}
      APP_TELEGRAM_CHAT_ID: ${APP_TELEGRAM_CHAT_ID}
    depends_on:
      - postgres
    restart: unless-stopped

  nvr-service:
    build:
      context: ../nvr-service
      dockerfile: Dockerfile
    container_name: nvr-service
    env_file:
      - .env
    ports:
      - "${NVR_SERVER_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      APP_JWT_SECRET: ${APP_JWT_SECRET}
      SERVER_PORT: ${NVR_SERVER_PORT:-8082}
    depends_on:
      - postgres
    restart: unless-stopped
