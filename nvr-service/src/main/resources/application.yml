server:
  port: 8082

spring:
  application:
    name: nvr-service

  datasource:
    url: jdbc:postgresql://89.23.102.97:5432/oko_api?sslmode=prefer
    username: oko_user
    password: Mx@:.s7T@#YUrg
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
